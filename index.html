<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VK Auto Posting — авторизация</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    body { margin: 0; padding: 20px; background: #f4f6fa; color: #182230; }
    main { max-width: 680px; margin: 7vh auto; padding: 28px; background: white; border: 1px solid #e3e8ef; border-radius: 18px; box-shadow: 0 12px 36px #14243a12; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { line-height: 1.55; color: #526173; }
    #status { margin: 20px 0; padding: 14px 16px; border-radius: 10px; background: #f0f4f8; white-space: pre-wrap; line-height: 1.5; }
    #status.ok { background: #eaf7ef; color: #17643a; }
    #status.err { background: #fff0ef; color: #9b2922; }
    #login { min-height: 48px; }
    .note { font-size: 13px; color: #6b7787; }
  </style>
  <script src="https://unpkg.com/@vkid/sdk@2.6.2/dist-sdk/umd/index.js"></script>
</head>
<body>
<main>
  <h1>VK Auto Posting</h1>
  <p>Подключение VK ID к серверу автоматизации. На этом этапе мы только проверяем авторизацию и сохраняем токены на сервере. Публикаций и загрузки фотографий не будет.</p>
  <div id="status" role="status">Подготавливаю безопасную авторизацию…</div>
  <div id="login"></div>
  <p class="note">Токены не отображаются на странице и не сохраняются в браузере или GitHub.</p>
</main>
<script>
(async () => {
  const APP_ID = 54919663;
  const REDIRECT_URL = 'https://masmarketm.github.io/vk-oauth-callback/';
  const WORKER_URL = 'https://vk-autopost-backend.ma-smarket-m.workers.dev';
  const status = document.getElementById('status');
  const login = document.getElementById('login');

  function show(message, kind) {
    status.textContent = message;
    status.className = kind || '';
  }

  async function worker(path, options = {}) {
    const response = await fetch(WORKER_URL + path, {
      ...options,
      mode: 'cors',
      credentials: 'omit',
      headers: {
        'Content-Type': 'application/json',
        ...(options.headers || {})
      }
    });
    const data = await response.json();
    if (!response.ok) {
      throw new Error(data.details || data.error || 'Ошибка серверного запроса');
    }
    return data;
  }

  try {
    if (!window.VKIDSDK) {
      throw new Error('Не удалось загрузить SDK VK ID. Обнови страницу позже.');
    }

    // Worker создаёт state и PKCE-пару; verifier остаётся только на сервере.
    const session = await worker('/auth/start', { method: 'POST', body: '{}' });
    if (!session.success || !session.state || !session.codeChallenge) {
      throw new Error('Сервер не подготовил сессию авторизации.');
    }

    const VKID = window.VKIDSDK;
    VKID.Config.init({
      app: APP_ID,
      redirectUrl: REDIRECT_URL,
      state: session.state,
      codeChallenge: session.codeChallenge,
      responseMode: VKID.ConfigResponseMode.Callback,
      source: VKID.ConfigSource.LOWCODE,
      scope: ''
    });

    const oneTap = new VKID.OneTap();
    oneTap.render({
      container: login,
      showAlternativeLogin: true
    })
    .on(VKID.WidgetEvents.ERROR, (error) => {
      console.error('VK ID widget error', error);
      show('Ошибка виджета VK ID. Проверь настройки приложения и Redirect URL.', 'err');
    })
    .on(VKID.OneTapInternalEvents.LOGIN_SUCCESS, async (payload) => {
      try {
        if (!payload || !payload.code || !payload.device_id) {
          throw new Error('VK ID не передал необходимые данные авторизации.');
        }

        show('Вход выполнен. Передаю код авторизации на сервер…');

        const result = await worker('/auth/exchange', {
          method: 'POST',
          body: JSON.stringify({
            code: payload.code,
            device_id: payload.device_id,
            state: session.state
          })
        });

        if (!result.success) {
          throw new Error(result.error || 'Не удалось сохранить авторизацию.');
        }

        const check = await worker('/auth/status');
        if (!check.authorized) {
          throw new Error('Сервер не подтвердил сохранение авторизации.');
        }

        show('УСПЕХ: VK ID авторизован, токены сохранены на сервере.\n\nНичего не опубликовано и фотографии не загружались.', 'ok');
        login.textContent = '';
      } catch (error) {
        console.error('VK server exchange failed', error);
        show('Не удалось завершить авторизацию: ' + (error.message || 'неизвестная ошибка') + '\n\nТокены на страницу не выводились. Пришли скриншот сообщения.', 'err');
      }
    });

    show('Сервер готов. Нажми кнопку VK ID для входа.');
  } catch (error) {
    console.error('Authorization setup failed', error);
    show('Не удалось подготовить авторизацию: ' + (error.message || 'неизвестная ошибка'), 'err');
  }
})();
</script>
</body>
</html>
